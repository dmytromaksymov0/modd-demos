<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  :root { --w: 2400px; --h: 1200px; }
  .row { position: absolute; left: 0; right: 0; top: 84px; display: flex; justify-content: center; align-items: flex-start; gap: 120px; }
  /* three identical phones on one baseline; height follows the 390×844 screenshot */
  .phone { position: relative; width: 410px; --pr: 58px; --pb: 13px; --sb: 40px; }
  .label { position: absolute; left: 0; right: 0; bottom: -52px; text-align: center; font-size: 22px; color: var(--muted); }
  .caption { left: 120px; bottom: 56px; font-size: 24px; }
  .caption .tab { font-size: 15px; }
  .mark { right: 120px; bottom: 50px; width: 120px; }
</style></head>
<body>
  <div class="row">
    <div class="phone" style="--sbg:{{m1_bg}}"><div class="notch"></div><div class="screen"><img src="{{m1}}" alt=""></div></div>
    <div class="phone" style="--sbg:{{m2_bg}}"><div class="notch"></div><div class="screen"><img src="{{m2}}" alt=""></div></div>
    <div class="phone" style="--sbg:{{m3_bg}}"><div class="notch"></div><div class="screen"><img src="{{m3}}" alt=""></div></div>
  </div>
  <div class="caption"><span class="tab"></span><b>{{title}}</b><span class="sep">·</span>{{niche}}<span class="sep">·</span>{{geo}}</div>
  <img class="mark" src="brand/modd-wordmark-ink.svg" alt="">
</body></html>
